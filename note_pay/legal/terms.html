<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotePay — Terms of Use</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 640px; margin: 3rem auto; padding: 0 1rem;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.7; color: #1d1d1f; background: #fff; text-align: center; }
  @media (prefers-color-scheme: dark) { body { color: #f5f5f7; background: #000; } }
  h1 { font-size: 1.5rem; }
  p.muted { color: #6e6e73; }
  .langs { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; margin-top: 1.5rem; }
  .langs a { display: block; padding: .8rem 1rem; border: 1px solid #d2d2d7; border-radius: 12px;
             text-decoration: none; color: #1d1d1f; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .langs a { color: #f5f5f7; border-color: #3a3a3c; } }
  .langs a:hover { border-color: #0a7afe; }
  .langs a.active { border-color: #0a7afe; background: rgba(10,122,254,.08); }
  footer { margin-top: 2rem; font-size: .85rem; color: #6e6e73; }
  footer a { color: #0a7afe; }
</style>
</head>
<body>
<main>
  <h1>NotePay Terms of Use</h1>
  <p class="muted">Please choose your language:</p>
  <div class="langs">
    <a href="terms_en.html" data-lang="en">English</a>
    <a href="terms_zh.html" data-lang="zh">中文（简体）</a>
    <a href="terms_de.html" data-lang="de">Deutsch</a>
    <a href="terms_es.html" data-lang="es">Español</a>
    <a href="terms_fr.html" data-lang="fr">Français</a>
    <a href="terms_ja.html" data-lang="ja">日本語</a>
    <a href="terms_ko.html" data-lang="ko">한국어</a>
  </div>
  <footer>
    <p><a href="../support.html">Support</a> · <a href="privacy.html">Privacy Policy</a></p>
  </footer>
</main>
<script>
  // 按浏览器语言高亮对应按钮（不强制跳转，方便审核员/用户手动选择）
  (function () {
    var lang = (navigator.language || 'en').slice(0, 2);
    var link = document.querySelector('a[data-lang="' + lang + '"]');
    if (link) link.classList.add('active');
  })();
</script>
</body>
</html>
